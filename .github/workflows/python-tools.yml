name: Python tools
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-test.txt
      - run: python -m tools.run_tests
      - run: python tools/skill_sync.py --check
