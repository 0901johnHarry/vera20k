name: Python tools
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest tools.tests.test_cargo_run -v
